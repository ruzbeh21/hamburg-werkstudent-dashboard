# Manual health check: which Jobsuche API endpoints answer from a GitHub runner.
# Prints only status codes and sizes (no posting content). Run from the Actions tab.
name: API check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/diagnose_api.py
      - name: Burst test (40 details in a row, like the pipeline)
        run: python scripts/diagnose_api.py --burst 40 1.0
      - name: Burst test with one shared Session (exactly like collect.py)
        run: python scripts/diagnose_api.py --burst 40 1.0 --session
